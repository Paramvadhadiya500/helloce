<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First S3 Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding: 80px 20px;
        }

        h1 {
            color: #ff9900;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        button {
            background-color: #232f3e;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Welcome to My AWS S3 Website!</h1>

    <p>This static website is hosted on Amazon S3.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("Hello! My S3 website is working successfully.");
        }
    </script>
</body>

</html>
